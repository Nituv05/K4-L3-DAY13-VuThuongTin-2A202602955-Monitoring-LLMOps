service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    99.5% good requests in a rolling 28-day window means a 0.5% error budget.
    For N request_received events, allowed bad requests = N * 0.005 (e.g. 5 per
    1,000). A request is good only when it reaches response_sent within 3,000 ms;
    failures and slower responses consume the budget.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
